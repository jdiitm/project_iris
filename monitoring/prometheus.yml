    # For Kubernetes:
    #   kubernetes_sd_configs:
    #     - role: pod
    #       namespaces:
    #         names: ['iris']
    #   relabel_configs:
    #     - source_labels: [__meta_kubernetes_pod_label_app]
    #       regex: iris-edge
    #       action: keep
    #
