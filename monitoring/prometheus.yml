global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'iris_edge'
    metrics_path: '/metrics'
    # Development: HTTP with static targets
    # Production: switch to HTTPS with service discovery (see below)
    scheme: 'http'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          region: 'local'
    bearer_token_file: /etc/iris/metrics_token

    # --- Production: Uncomment for multi-node TLS scraping ---
    # scheme: 'https'
    # tls_config:
    #   insecure_skip_verify: false
    #   ca_file: /etc/iris/certs/ca.pem
