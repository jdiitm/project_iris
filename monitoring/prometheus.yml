global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'iris_edge'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['localhost:9090']
    # For TLS-enabled production deployments, use:
    # scheme: 'https'
    # tls_config:
    #   insecure_skip_verify: false
    #   ca_file: /etc/iris/certs/ca.pem
    bearer_token_file: /etc/iris/metrics_token
