[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Start with essential rules only. Ratchet up over time.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "E741",  # ambiguous variable name (common in test code)
    "W605",  # invalid escape sequence (common in regex patterns)
    "W291",  # trailing whitespace (cosmetic, not a correctness issue)
    "W293",  # whitespace before ':' (cosmetic, not a correctness issue)
]

[tool.ruff.lint.per-file-ignores]
# Test files may have unused imports for side-effects
"tests/**/conftest.py" = ["F401"]
