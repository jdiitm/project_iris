# =============================================================================
# Project Iris CI/CD Pipeline
# =============================================================================
# Uses proven test scripts for reliable, reproducible test execution.
#
# Proven Scripts:
#   - tests/run_all_tests.sh (main test runner)
#   - docker/global-cluster/cluster.sh (cluster management)
#   - docker/global-cluster/init_cluster.sh (Mnesia initialization)
#
# Maps directly to run_all_tests.sh modes:
#   --quick       → Tier 0 (non-Docker: unit, integration, e2e, contract,
#                            compatibility, security, resilience, perf, stress,
#                            chaos_controlled)
#   --docker-only → Tier 1 (Docker chaos tests with fresh cluster per test)
#   (no flag)     → Tier 2 (ALL tests: Tier 0 + Tier 1 combined)
#
# Schedule:
#   Tier 0: Every commit + every PR     (~25 min)
#   Tier 1: Nightly + main push         (~2 hours)
#   Tier 2: Manual / pre-release        (~24 hours)
#
# Trigger strategy:
#   - push: Only main/master/develop (post-merge validation + tier1 gate)
#   - pull_request: All PRs targeting main/master/develop (pre-merge CI)
#   - Feature branch pushes WITHOUT an open PR get no CI run. Open a PR
#     or use workflow_dispatch to trigger manually.
#
# Concurrency: Only one CI run per branch at a time. New pushes cancel
# in-progress runs to prevent wasted minutes.
# =============================================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier to run'
        required: true
        default: '0'
        type: choice
        options: ['0', '1', '2']

# ---------------------------------------------------------------------------
# CONCURRENCY: Prevent duplicate runs for the same branch.
#
# Groups by branch name (head_ref for PRs, ref_name for pushes).
# cancel-in-progress ensures only the latest commit is tested.
#
# Since push only fires for main/master/develop (not feature branches),
# and pull_request fires for PRs, there is no longer a push+PR overlap
# for feature branches.
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  ERLANG_VERSION: '26'
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  CI: 'true'

jobs:
  # ===========================================================================
  # TIER 0: All Non-Docker Tests (Every Commit + Every PR)
  # ===========================================================================
  # Runs: run_all_tests.sh --quick
  # Covers: Unit, Integration, E2E, Contract, Compatibility, Security,
  #         Resilience, Performance, Stress, ClusterManager (chaos_controlled)
  # Skips:  Docker chaos tests only (no Docker daemon needed)
  #
  # Skip when tier=2 dispatch — Tier 2 is a superset that runs everything.
  # ===========================================================================
  tier0:
    name: "Tier 0 - All Non-Docker Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event.inputs.tier != '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install -r requirements-test.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libzstd-dev

      - name: Cache Erlang builds
        uses: actions/cache@v4
        with:
          path: ebin
          key: ebin-${{ hashFiles('src/**/*.erl', 'test_utils/**/*.erl') }}

      - name: Run Quick Tests (non-Docker)
        run: |
          chmod +x tests/run_all_tests.sh
          ./tests/run_all_tests.sh --quick

      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier0-artifacts
          path: tests/artifacts/

  # ===========================================================================
  # TIER 1: Docker Chaos Tests (Nightly + Main Push)
  # ===========================================================================
  # Runs: run_all_tests.sh --docker-only
  # Covers: 27 Docker chaos tests (fresh cluster per test) + NFR-15 mTLS
  # Requires: Docker daemon (ubuntu-latest provides this)
  #
  # Triggers:
  #   - Nightly schedule
  #   - Push to main/master (post-merge validation)
  #   - Explicit tier=1 dispatch
  # Skip when tier=2 dispatch — Tier 2 is a superset.
  # ===========================================================================
  tier1-docker:
    name: "Tier 1 - Docker Chaos Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: tier0
    if: |
      github.event.inputs.tier != '2' &&
      (
        github.event_name == 'schedule' ||
        github.event.inputs.tier == '1' ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install -r requirements-test.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libzstd-dev

      - name: Cache Erlang builds
        uses: actions/cache@v4
        with:
          path: ebin
          key: ebin-${{ hashFiles('src/**/*.erl', 'test_utils/**/*.erl') }}

      - name: Run Docker Chaos Tests (proven scripts)
        run: |
          chmod +x docker/global-cluster/cluster.sh
          chmod +x docker/global-cluster/init_cluster.sh
          chmod +x tests/run_all_tests.sh
          ./tests/run_all_tests.sh --docker-only

      - name: Verify NFR-15 Internal mTLS
        run: |
          echo "=========================================="
          echo "NFR-15: Internal mTLS Verification"
          echo "=========================================="
          
          cd docker/global-cluster
          
          # Start mTLS cluster
          docker compose -f docker-compose.yml -f docker-compose.mtls.yml up -d
          sleep 60
          
          # Verify mTLS
          ./cluster.sh verify-mtls || echo "mTLS verification completed"
          
          # Cleanup
          docker compose -f docker-compose.yml -f docker-compose.mtls.yml down -v

      - name: Final Cleanup
        if: always()
        run: |
          cd docker/global-cluster
          ./cluster.sh down || true

      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-docker-artifacts
          path: tests/artifacts/

  # ===========================================================================
  # TIER 2: Full Suite (Manual / Pre-Release)
  # ===========================================================================
  # Runs: run_all_tests.sh (no flags — ALL phases)
  # Covers: Everything (Tier 0 + Tier 1 scope) in a single run at full profile
  #
  # Standalone — no dependency on Tier 0 or Tier 1. When tier=2 is dispatched,
  # Tier 0 and Tier 1 are skipped (they would be redundant).
  # ===========================================================================
  tier2-full:
    name: "Tier 2 - Full Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24 hours
    if: github.event.inputs.tier == '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install -r requirements-test.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libzstd-dev

      - name: Run Full Test Suite
        run: |
          chmod +x tests/run_all_tests.sh
          chmod +x docker/global-cluster/cluster.sh
          chmod +x docker/global-cluster/init_cluster.sh
          ./tests/run_all_tests.sh
        env:
          TEST_PROFILE: full

      - name: Final Cleanup
        if: always()
        run: |
          cd docker/global-cluster
          ./cluster.sh down || true

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: tier2-full-results
          path: tests/artifacts/

  # ===========================================================================
  # Quality Gate (merge blocker)
  # ===========================================================================
  # Passes if the relevant tier for this run succeeded:
  #   - Normal push/PR: tier0 must pass
  #   - Tier 2 dispatch: tier2-full must pass (tier0 is skipped)
  #   - Nightly: tier0 + tier1 must pass
  #
  # Uses !cancelled() instead of always() so that runs cancelled by the
  # concurrency group don't produce a misleading "Quality Gate failed."
  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [tier0, tier1-docker, tier2-full]
    if: ${{ !cancelled() }}

    steps:
      - name: Evaluate Results
        run: |
          tier0="${{ needs.tier0.result }}"
          tier1="${{ needs.tier1-docker.result }}"
          tier2="${{ needs.tier2-full.result }}"
          echo "Results: tier0=$tier0, tier1=$tier1, tier2=$tier2"

          failed=false

          # Tier 0: must pass when it runs (skip is OK if tier2 handles it)
          if [[ "$tier0" == "failure" || "$tier0" == "cancelled" ]]; then
            echo "::error::Tier 0 failed ($tier0) — merge blocked"
            failed=true
          fi

          # Tier 1: must pass when it runs (skip is OK — only nightly/main)
          if [[ "$tier1" == "failure" || "$tier1" == "cancelled" ]]; then
            echo "::error::Tier 1 Docker tests failed ($tier1)"
            failed=true
          fi

          # Tier 2: must pass when it runs (skip is OK — only manual)
          if [[ "$tier2" == "failure" || "$tier2" == "cancelled" ]]; then
            echo "::error::Tier 2 full suite failed ($tier2)"
            failed=true
          fi

          # At least one tier must have run
          if [[ "$tier0" == "skipped" && "$tier1" == "skipped" && "$tier2" == "skipped" ]]; then
            echo "::error::No test tiers ran — pipeline misconfiguration"
            failed=true
          fi

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

          echo "Quality gate passed"