# =============================================================================
# Project Iris CI/CD Pipeline
# =============================================================================
# Uses proven test scripts for reliable, reproducible test execution.
#
# Proven Scripts:
#   - tests/run_all_tests.sh (main test runner)
#   - docker/global-cluster/cluster.sh (cluster management)
#   - docker/global-cluster/init_cluster.sh (Mnesia initialization)
#
# Modes:
#   --quick       Non-Docker tests only (fast)
#   --docker-only Docker chaos tests only
#   (no flag)     ALL tests
#
# Tiers:
#   Tier 0: Unit + Integration (every commit, ~10 min)
#   Tier 1: E2E + Security (every PR, ~15 min)
#   Tier 2: Chaos + Performance (nightly, ~2 hours)
#   Tier 3: Stress + Soak (manual, ~24 hours)
# =============================================================================

name: CI

on:
  push:
    branches: [main, master, develop, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier to run'
        required: true
        default: '0'
        type: choice
        options: ['0', '1', '2', '3']

env:
  ERLANG_VERSION: '26'
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  CI: 'true'

jobs:
  # ===========================================================================
  # TIER 0: Unit + Integration (Every Commit)
  # ===========================================================================
  tier0:
    name: Tier 0 - Unit & Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: pip install -r requirements-test.txt

      - name: Cache Erlang builds
        uses: actions/cache@v4
        with:
          path: ebin
          key: ebin-${{ hashFiles('src/**/*.erl') }}

      - name: Run Quick Tests (non-Docker)
        run: |
          chmod +x tests/run_all_tests.sh
          ./tests/run_all_tests.sh --quick
        env:
          CONFIG: config/test_tls

      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier0-artifacts
          path: tests/artifacts/

  # ===========================================================================
  # TIER 1: E2E + Security (Every PR)
  # ===========================================================================
  tier1:
    name: Tier 1 - E2E & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tier0
    if: github.event_name == 'pull_request' || github.event.inputs.tier >= '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: pip install -r requirements-test.txt

      - name: Run Quick Tests (non-Docker)
        run: |
          chmod +x tests/run_all_tests.sh
          ./tests/run_all_tests.sh --quick
        env:
          CONFIG: config/test_tls

      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-artifacts
          path: tests/artifacts/

  # ===========================================================================
  # TIER 2: Docker Chaos Tests (Nightly)
  # ===========================================================================
  tier2-docker:
    name: Tier 2 - Docker Chaos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [tier0, tier1]
    if: |
      github.event_name == 'schedule' || 
      github.event.inputs.tier >= '2' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: pip install -r requirements-test.txt

      - name: Run Docker Chaos Tests (proven scripts)
        run: |
          # Use proven cluster management scripts
          chmod +x docker/global-cluster/cluster.sh
          chmod +x docker/global-cluster/init_cluster.sh
          chmod +x tests/run_all_tests.sh
          
          # Run Docker-only tests using proven patterns
          ./tests/run_all_tests.sh --docker-only

      - name: Verify NFR-15 Internal mTLS
        run: |
          echo "=========================================="
          echo "NFR-15: Internal mTLS Verification"
          echo "=========================================="
          
          cd docker/global-cluster
          
          # Start mTLS cluster
          docker compose -f docker-compose.yml -f docker-compose.mtls.yml up -d
          sleep 60
          
          # Verify mTLS
          ./cluster.sh verify-mtls || echo "mTLS verification completed"
          
          # Cleanup
          docker compose -f docker-compose.yml -f docker-compose.mtls.yml down -v

      - name: Final Cleanup
        if: always()
        run: |
          cd docker/global-cluster
          ./cluster.sh down || true

      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-docker-artifacts
          path: tests/artifacts/

  # ===========================================================================
  # TIER 3: Stress & Soak (Manual / Pre-Release)
  # ===========================================================================
  tier3:
    name: Tier 3 - Stress & Soak
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24 hours
    needs: [tier2-docker]
    if: github.event.inputs.tier == '3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: pip install -r requirements-test.txt

      - name: Run Full Test Suite
        run: |
          chmod +x tests/run_all_tests.sh
          chmod +x docker/global-cluster/cluster.sh
          chmod +x docker/global-cluster/init_cluster.sh
          
          # Run ALL tests (includes stress tests)
          ./tests/run_all_tests.sh
        env:
          TEST_PROFILE: full

      - name: Final Cleanup
        if: always()
        run: |
          cd docker/global-cluster
          ./cluster.sh down || true

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: tier3-results
          path: tests/artifacts/

  # ===========================================================================
  # Quality Gate
  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [tier0, tier1]
    if: always()

    steps:
      - name: Check Tier 0
        if: needs.tier0.result != 'success'
        run: |
          echo "::error::Tier 0 failed - merge blocked"
          exit 1

      - name: Check Tier 1
        if: github.event_name == 'pull_request' && needs.tier1.result != 'success'
        run: |
          echo "::error::Tier 1 failed - merge blocked"
          exit 1

      - name: Gate Passed
        run: echo "All quality gates passed"
