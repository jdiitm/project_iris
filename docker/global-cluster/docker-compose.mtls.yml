# =============================================================================
# Project Iris: mTLS Overlay for Global Cluster
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.mtls.yml up
#
# This overlay enables mutual TLS for Erlang distribution (inter-node comms).
# Each node creates symlinks from its cert/key to the generic names expected
# by config/ssl_dist.conf (node.pem, node.key).
# =============================================================================

x-mtls-volumes: &mtls-volumes
  # Certs must be writable so containers can create node.pem/node.key symlinks
  - ../../certs:/app/certs

x-mtls-environment: &mtls-environment
  IRIS_COOKIE: ${IRIS_COOKIE:-iris_secret}
  IRIS_MTLS_ENABLED: "true"
  IRIS_MTLS_CA: /app/certs/ca.pem

services:
  # ==========================================================================
  # CORE NODES with mTLS
  # ==========================================================================
  core-east-1:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/core-east-1.pem
      IRIS_MTLS_KEY: /app/certs/core-east-1.key
    command: ["sh", "-c", "ln -sf /app/certs/core-east-1.pem /app/certs/node.pem && ln -sf /app/certs/core-east-1.key /app/certs/node.key && mkdir -p /data/mnesia/wal && cd /app && erl -noinput -sname core_east_1@coreeast1 -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -mnesia dir '\"/data/mnesia\"' -iris_core wal_directory '\"/data/mnesia/wal\"' -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(mnesia), iris_core:init_db(), application:ensure_all_started(iris_core).'"]

  core-east-2:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/core-east-2.pem
      IRIS_MTLS_KEY: /app/certs/core-east-2.key
    command: ["sh", "-c", "ln -sf /app/certs/core-east-2.pem /app/certs/node.pem && ln -sf /app/certs/core-east-2.key /app/certs/node.key && mkdir -p /data/mnesia/wal && cd /app && rm -rf /data/mnesia/LATEST.LOG /data/mnesia/*.LOG /data/mnesia/schema* && erl -noinput -sname core_east_2@coreeast2 -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -mnesia dir '\"/data/mnesia\"' -iris_core wal_directory '\"/data/mnesia/wal\"' -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'timer:sleep(5000), pong = net_adm:ping(core_east_1@coreeast1), mnesia:start(), mnesia:change_config(extra_db_nodes, [core_east_1@coreeast1]), mnesia:change_table_copy_type(schema, node(), disc_copies), ok = mnesia:wait_for_tables([schema], 30000), timer:sleep(2000), application:ensure_all_started(iris_core).'"]

  core-west-1:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/core-west-1.pem
      IRIS_MTLS_KEY: /app/certs/core-west-1.key
    command: ["sh", "-c", "ln -sf /app/certs/core-west-1.pem /app/certs/node.pem && ln -sf /app/certs/core-west-1.key /app/certs/node.key && mkdir -p /data/mnesia/wal && cd /app && rm -rf /data/mnesia/LATEST.LOG /data/mnesia/*.LOG /data/mnesia/schema* && erl -noinput -sname core_west_1@corewest1 -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -mnesia dir '\"/data/mnesia\"' -iris_core wal_directory '\"/data/mnesia/wal\"' -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'timer:sleep(5000), pong = net_adm:ping(core_east_1@coreeast1), mnesia:start(), mnesia:change_config(extra_db_nodes, [core_east_1@coreeast1]), mnesia:change_table_copy_type(schema, node(), disc_copies), ok = mnesia:wait_for_tables([schema], 30000), timer:sleep(2000), application:ensure_all_started(iris_core).'"]

  core-west-2:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/core-west-2.pem
      IRIS_MTLS_KEY: /app/certs/core-west-2.key
    command: ["sh", "-c", "ln -sf /app/certs/core-west-2.pem /app/certs/node.pem && ln -sf /app/certs/core-west-2.key /app/certs/node.key && mkdir -p /data/mnesia/wal && cd /app && rm -rf /data/mnesia/LATEST.LOG /data/mnesia/*.LOG /data/mnesia/schema* && erl -noinput -sname core_west_2@corewest2 -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -mnesia dir '\"/data/mnesia\"' -iris_core wal_directory '\"/data/mnesia/wal\"' -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'timer:sleep(8000), pong = net_adm:ping(core_west_1@corewest1), mnesia:start(), mnesia:change_config(extra_db_nodes, [core_west_1@corewest1]), mnesia:change_table_copy_type(schema, node(), disc_copies), ok = mnesia:wait_for_tables([schema], 30000), timer:sleep(2000), application:ensure_all_started(iris_core).'"]

  core-eu-1:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
