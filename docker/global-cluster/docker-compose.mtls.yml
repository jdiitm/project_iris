      IRIS_MTLS_CERT: /app/certs/edge-sydney-2.pem
      IRIS_MTLS_KEY: /app/certs/edge-sydney-2.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-sydney-2.pem /app/certs/node.pem && ln -sf /app/certs/edge-sydney-2.key /app/certs/node.key && cd /app && erl -noinput -sname edge_sydney_2@edgesydney2 -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8091 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_east_2@coreeast2).'"]

