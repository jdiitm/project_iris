      IRIS_MTLS_KEY: /app/certs/core-eu-1.key
    command: ["sh", "-c", "ln -sf /app/certs/core-eu-1.pem /app/certs/node.pem && ln -sf /app/certs/core-eu-1.key /app/certs/node.key && mkdir -p /data/mnesia/wal && cd /app && rm -rf /data/mnesia/LATEST.LOG /data/mnesia/*.LOG /data/mnesia/schema* && erl -noinput -sname core_eu_1@coreeu1 -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -mnesia dir '\"/data/mnesia\"' -iris_core wal_directory '\"/data/mnesia/wal\"' -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'timer:sleep(6000), pong = net_adm:ping(core_east_1@coreeast1), mnesia:start(), mnesia:change_config(extra_db_nodes, [core_east_1@coreeast1]), mnesia:change_table_copy_type(schema, node(), disc_copies), ok = mnesia:wait_for_tables([schema], 30000), timer:sleep(2000), application:ensure_all_started(iris_core).'"]

  core-eu-2:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/core-eu-2.pem
      IRIS_MTLS_KEY: /app/certs/core-eu-2.key
    command: ["sh", "-c", "ln -sf /app/certs/core-eu-2.pem /app/certs/node.pem && ln -sf /app/certs/core-eu-2.key /app/certs/node.key && mkdir -p /data/mnesia/wal && cd /app && rm -rf /data/mnesia/LATEST.LOG /data/mnesia/*.LOG /data/mnesia/schema* && erl -noinput -sname core_eu_2@coreeu2 -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -mnesia dir '\"/data/mnesia\"' -iris_core wal_directory '\"/data/mnesia/wal\"' -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'timer:sleep(8000), pong = net_adm:ping(core_eu_1@coreeu1), mnesia:start(), mnesia:change_config(extra_db_nodes, [core_eu_1@coreeu1]), mnesia:change_table_copy_type(schema, node(), disc_copies), ok = mnesia:wait_for_tables([schema], 30000), timer:sleep(2000), application:ensure_all_started(iris_core).'"]

  # ==========================================================================
  # EDGE NODES with mTLS
  # ==========================================================================
  edge-east-1:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/edge-east-1.pem
      IRIS_MTLS_KEY: /app/certs/edge-east-1.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-east-1.pem /app/certs/node.pem && ln -sf /app/certs/edge-east-1.key /app/certs/node.key && cd /app && erl -noinput -sname edge_east_1@edgeeast1 -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8085 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_east_1@coreeast1).'"]

  edge-east-2:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/edge-east-2.pem
      IRIS_MTLS_KEY: /app/certs/edge-east-2.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-east-2.pem /app/certs/node.pem && ln -sf /app/certs/edge-east-2.key /app/certs/node.key && cd /app && erl -noinput -sname edge_east_2@edgeeast2 -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8086 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_east_2@coreeast2).'"]

  edge-west-1:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/edge-west-1.pem
      IRIS_MTLS_KEY: /app/certs/edge-west-1.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-west-1.pem /app/certs/node.pem && ln -sf /app/certs/edge-west-1.key /app/certs/node.key && cd /app && erl -noinput -sname edge_west_1@edgewest1 -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8087 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_west_1@corewest1).'"]

  edge-west-2:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/edge-west-2.pem
      IRIS_MTLS_KEY: /app/certs/edge-west-2.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-west-2.pem /app/certs/node.pem && ln -sf /app/certs/edge-west-2.key /app/certs/node.key && cd /app && erl -noinput -sname edge_west_2@edgewest2 -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8088 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_west_2@corewest2).'"]

  edge-eu-1:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/edge-eu-1.pem
      IRIS_MTLS_KEY: /app/certs/edge-eu-1.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-eu-1.pem /app/certs/node.pem && ln -sf /app/certs/edge-eu-1.key /app/certs/node.key && cd /app && erl -noinput -sname edge_eu_1@edgeeu1 -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8089 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_eu_1@coreeu1).'"]

  edge-eu-2:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/edge-eu-2.pem
      IRIS_MTLS_KEY: /app/certs/edge-eu-2.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-eu-2.pem /app/certs/node.pem && ln -sf /app/certs/edge-eu-2.key /app/certs/node.key && cd /app && erl -noinput -sname edge_eu_2@edgeeu2 -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8094 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_eu_2@coreeu2).'"]

  edge-sydney-1:
    volumes: *mtls-volumes
    environment:
      <<: *mtls-environment
      IRIS_MTLS_CERT: /app/certs/edge-sydney-1.pem
      IRIS_MTLS_KEY: /app/certs/edge-sydney-1.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-sydney-1.pem /app/certs/node.pem && ln -sf /app/certs/edge-sydney-1.key /app/certs/node.key && cd /app && erl -noinput -sname edge_sydney_1@edgesydney1 -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8090 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_east_1@coreeast1).'"]

