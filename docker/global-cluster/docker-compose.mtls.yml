      IRIS_MTLS_CERT: /app/certs/edge-saopaulo.pem
      IRIS_MTLS_KEY: /app/certs/edge-saopaulo.key
    command: ["sh", "-c", "ln -sf /app/certs/edge-saopaulo.pem /app/certs/node.pem && ln -sf /app/certs/edge-saopaulo.key /app/certs/node.key && cd /app && erl -noinput -sname edge_saopaulo@edgesaopaulo -hidden -setcookie $$IRIS_COOKIE -pa ebin -config config/test_mtls -iris_edge port 8092 -proto_dist inet_tls -ssl_dist_optfile /app/config/ssl_dist.conf -eval 'application:ensure_all_started(ssl), application:ensure_all_started(iris_edge), net_adm:ping(core_west_1@corewest1).'"]
